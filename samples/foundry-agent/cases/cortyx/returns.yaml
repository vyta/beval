# eCommerce Returns — evaluation cases
#
# These cases evaluate the agent's ability to analyze return rates,
# refund breakdowns, and product-level return patterns.
#
# Grading approach:
#   - Deterministic layer (dev mode): completion time, response length
#   - AI-judged layer (validation mode): LLM judge assesses accuracy
#     of return metrics and correct filtering logic

background:
  category: returns
  given:
    domain: ecommerce-analytics

cases:
  # ── Return Metrics ──────────────────────────────────────────────

  - id: overall_return_rate
    name: Overall return rate
    tags: [returns, rate, core]
    given:
      query: "What is the overall return rate based on the distinct count of returned orders?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              the percentage of orders that have been returned based on
              distinct order count

  - id: refund_by_reason
    name: Refund amounts by return reason
    tags: [returns, refunds, reasons]
    given:
      query: "How do refund amounts break down by return reason?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              total refund amounts grouped by each return reason

  - id: return_rate_per_category
    name: Return rate per product category
    tags: [returns, categories, rate]
    given:
      query: "What is the breakdown of the overall return rate per product category using the returns data when the status is approved, refunded, or requested?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              return rates for each product category, considering only
              returns with status approved, refunded, or requested

  - id: top_10_returned_products
    name: Top 10 most-returned products
    tags: [returns, products, top-n]
    given:
      query: "What are the top 10 most-returned products?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [100, 10000]
          - the answer should be: >
              a ranked list of the 10 products with the highest number
              of returns
