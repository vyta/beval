# eCommerce Cross-Domain — evaluation cases
#
# These cases evaluate the agent's ability to join and correlate data
# across multiple tables to answer complex analytical questions.
#
# Grading approach:
#   - Deterministic layer (dev mode): completion time, response length
#   - AI-judged layer (validation mode): LLM judge assesses accuracy
#     of cross-table joins and multi-step reasoning

background:
  category: cross-domain
  given:
    domain: ecommerce-analytics

cases:
  # ── Returns × Other Domains ─────────────────────────────────────

  - id: repeat_returners
    name: Repeat returners with 3+ returns
    tags: [returns, customers, behavior]
    given:
      query: "How many users are repeat returners with 3 or more returns?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              the count of users who have 3 or more return records

  - id: return_rate_by_region
    name: Return rate by shipping region
    tags: [returns, shipping, region]
    given:
      query: "How does the return rate vary by shipping region?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              the return rate for each shipping region

  - id: returns_vs_review_sentiment_trends
    name: Monthly return trends vs review sentiment trends
    tags: [returns, reviews, trends]
    given:
      query: "How do monthly return trends compare to review sentiment trends?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [100, 10000]
          - the answer should be: >
              a month-by-month comparison of return volume and review
              sentiment metrics

  - id: returns_by_status_type
    name: Returns by status type
    tags: [returns, status]
    given:
      query: "How many returns are there by status type in returns?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a count of returns grouped by each status type

  # ── Shipping × Spending ─────────────────────────────────────────

  - id: carrier_shipping_cost_comparison
    name: Carriers compared on average shipping cost
    tags: [shipping, carriers, cost]
    given:
      query: "How do carriers compare on average shipping cost when looking at the shipping cost column?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              average shipping cost for each carrier for comparison

  - id: top_5_net_spend_after_returns
    name: Top 5 customers by net spend after returns
    tags: [customers, returns, revenue, top-n, core]
    given:
      query: "Which top 5 customers have the highest net spend after returns?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a ranked list of 5 customers with the highest total spend
              minus refund amounts
