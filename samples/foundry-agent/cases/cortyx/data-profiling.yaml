          - the answer should be: >
              a count of orders with coupon applied vs orders without

  - id: first_vs_repeat_orders
    name: First-time vs repeat purchases
    tags: [distribution, orders]
    given:
      query: "How many orders are first-time vs repeat purchases?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              a count of first-time purchase orders vs repeat purchase orders
