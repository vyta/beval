# eCommerce Data Profiling — evaluation cases
#
# These cases evaluate the agent's ability to profile and describe
# the structure, shape, and distributions of the ecommerce dataset.
#
# Grading approach:
#   - Deterministic layer (dev mode): completion time, response length
#   - AI-judged layer (validation mode): LLM judge assesses completeness
#     and accuracy of profiling results

background:
  category: data-profiling
  given:
    domain: ecommerce-analytics

cases:
  # ── Schema & Shape ──────────────────────────────────────────────

  - id: row_counts
    name: Row counts for each table
    tags: [schema, counts]
    given:
      query: "How many rows are in each table?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              a complete listing of row counts for each table in the dataset

  - id: distinct_primary_keys
    name: Distinct values per primary key column
    tags: [schema, keys]
    given:
      query: "How many distinct values does each primary key column have?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - response should contain: "distinct"
          - the answer should be: >
              a listing of distinct value counts for each primary key column

  - id: date_ranges
    name: Date range for each date column
    tags: [schema, dates]
    given:
      query: "What is the date range for each date column?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              a listing of min and max dates for each date column across datasets

  - id: null_values
    name: NULL value counts per column
    tags: [quality, nulls]
    given:
      query: "Across each dataset which columns have NULL values and how many?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              a breakdown of null counts per column across each dataset

  # ── Distributions ───────────────────────────────────────────────

  - id: order_status_distribution
    name: Distribution of order statuses
    tags: [distribution, orders]
    given:
      query: "What is the distribution of order statuses?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a count or percentage breakdown of each order status value

  - id: user_status_distribution
    name: Distribution of user statuses
    tags: [distribution, users]
    given:
      query: "What is the distribution of user statuses?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a count or percentage breakdown of each user status value

  - id: product_category_brand_distribution
    name: Products distributed across categories and brands
    tags: [distribution, products]
    given:
      query: "How are products distributed across categories and brands?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              a breakdown of product counts by category and brand

  - id: payment_method_distribution
    name: Payment method frequency
    tags: [distribution, payments]
    given:
      query: "What payment methods are used and how often?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a frequency count of each payment method

  - id: shipping_carrier_distribution
    name: Shipping carrier frequency
    tags: [distribution, shipping]
    given:
      query: "Which shipping carriers are used and how often?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a frequency count of each shipping carrier

  - id: return_reasons
    name: Most common reasons for returns
    tags: [distribution, returns]
    given:
      query: "What are the most common reasons for returns?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a ranked list of return reasons by frequency

  - id: cart_status_distribution
    name: Distribution of cart statuses
    tags: [distribution, carts]
    given:
      query: "What is the distribution of cart statuses?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
