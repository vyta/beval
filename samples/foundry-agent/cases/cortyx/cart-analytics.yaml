# eCommerce Cart Analytics — evaluation cases
#
# These cases evaluate the agent's ability to analyze cart behavior,
# abandonment patterns, and conversion metrics.
#
# Grading approach:
#   - Deterministic layer (dev mode): completion time, response length
#   - AI-judged layer (validation mode): LLM judge assesses accuracy
#     of cart metrics and correct conversion calculations

background:
  category: cart-analytics
  given:
    domain: ecommerce-analytics

cases:
  # ── Cart Value & Items ──────────────────────────────────────────

  - id: avg_cart_value_by_status
    name: Average cart value by cart status
    tags: [carts, value]
    given:
      query: "What is the average cart value by cart status?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              the average cart value for each cart status

  - id: avg_items_per_cart
    name: Average items per cart
    tags: [carts, items]
    given:
      query: "What is the average number of items per cart based on the quantity column in cart_items?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              the average item quantity per cart

  - id: avg_cart_value_by_device
    name: Average cart value by device type
    tags: [carts, device, value]
    given:
      query: "How does average cart value vary by device type?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              average cart value for each device type

  - id: avg_cart_value_by_traffic_source
    name: Average cart value by traffic source
    tags: [carts, traffic, value]
    given:
      query: "How does average cart value vary by traffic source?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              average cart value for each traffic source

  # ── Conversion & Abandonment ────────────────────────────────────

  - id: cart_abandonment_conversion_rate
    name: Cart abandonment and conversion rate
    tags: [carts, abandonment, conversion, core]
    given:
      query: "What is the cart abandonment rate and conversion rate when filtering the carts data status to be abandoned or converted?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              the percentage of carts that are abandoned and the
              percentage that converted

  - id: conversion_rate_by_traffic_source
    name: Cart-to-order conversion rate by traffic source
    tags: [carts, conversion, traffic]
    given:
      query: "What is the cart-to-order conversion rate by traffic source?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              the conversion rate from cart to order for each traffic source

  # ── Trends & Comparisons ────────────────────────────────────────

  - id: category_carts_vs_orders
    name: Category preferences in carts vs actual orders
    tags: [carts, orders, categories]
    given:
      query: "How do category preferences differ between carts and actual orders?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              a comparison of product category distribution in carts vs
              in completed orders

  - id: carts_created_monthly_trend
    name: Carts created per month trend
    tags: [carts, trends]
    given:
      query: "What is the trend of carts created per month?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              monthly counts of new carts created showing the trend
              over time
