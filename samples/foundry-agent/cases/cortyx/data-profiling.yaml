          - the answer should be: >
              a count breakdown of reviews by sentiment category

  - id: review_rating_distribution
    name: Distribution of review ratings (1-5 stars)
    tags: [distribution, reviews]
    given:
      query: "What is the distribution of review ratings (1-5 stars)?"
    stages:
      - when: the agent processes the request
