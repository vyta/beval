  - id: shipping_status_distribution
    name: Distribution of shipping statuses
    tags: [distribution, shipping]
    given:
      query: "What is the distribution of shipping statuses?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a count or percentage breakdown of each shipping status

  - id: payment_risk_flags
    name: Payments with risk flags
    tags: [distribution, payments, risk]
    given:
      query: "How many payments have risk flags?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              a count of payments flagged as high risk vs not flagged

  - id: loyalty_tier_distribution
    name: Users distributed across loyalty tiers
    tags: [distribution, users, loyalty]
    given:
      query: "How are users distributed across loyalty tiers?"
    stages:
