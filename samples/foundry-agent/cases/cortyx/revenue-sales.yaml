# eCommerce Revenue & Sales — evaluation cases
#
# These cases evaluate the agent's ability to compute revenue metrics,
# identify trends, and break down sales by various dimensions.
#
# Grading approach:
#   - Deterministic layer (dev mode): completion time, response length,
#     keyword presence
#   - AI-judged layer (validation mode): LLM judge assesses numeric
#     accuracy and completeness of revenue analysis

background:
  category: revenue-sales
  given:
    domain: ecommerce-analytics

cases:
  # ── Summary Metrics ─────────────────────────────────────────────

  - id: total_revenue_metrics
    name: Total revenue, order count, and AOV
    tags: [revenue, summary, core]
    given:
      query: "What is the total revenue, order count, and average order value?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - response should contain: "revenue"
          - the answer should be: >
              numeric values for total revenue, total order count, and
              average order value

  - id: monthly_revenue_trend
    name: Monthly revenue trend
    tags: [revenue, trends]
    given:
      query: "What is the monthly revenue trend?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [100, 10000]
          - the answer should be: >
              a month-by-month breakdown of revenue showing the trend
              over time

  # ── Revenue Breakdowns ──────────────────────────────────────────

  - id: revenue_by_channel
    name: Revenue by sales channel
    tags: [revenue, channels]
    given:
      query: "How does revenue break down by sales channel?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              revenue totals grouped by each sales channel

  - id: revenue_by_device
    name: Revenue by device type
    tags: [revenue, device]
    given:
      query: "How does revenue break down by device type?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              revenue totals grouped by device type

  - id: revenue_by_region
    name: Revenue by shipping region
    tags: [revenue, region]
    given:
      query: "How does revenue break down by shipping region?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              revenue totals grouped by shipping region

  - id: avg_discount_pct
    name: Average discount percentage per order
    tags: [revenue, discounts]
    given:
      query: "What is the average discount percentage per order for orders with a subtotal greater than 0?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              the average discount as a percentage, computed only for
              orders with subtotal greater than zero

  - id: coupon_impact_revenue
    name: Coupon usage rate and impact on revenue
    tags: [revenue, coupons]
    given:
      query: "What is the coupon usage rate and its impact on revenue?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - response should contain: "coupon"
          - the answer should be: >
              the percentage of orders using coupons and the revenue
              comparison between coupon and non-coupon orders

  - id: revenue_components
    name: Revenue split between subtotal, tax, shipping, and discounts
    tags: [revenue, breakdown]
    given:
      query: "How does revenue split between subtotal, tax, shipping fees, and discounts?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a breakdown of total subtotal, total tax, total shipping
              fees, and total discounts across all orders

  - id: top_10_orders
    name: Top 10 highest-value orders
    tags: [revenue, top-n]
    given:
      query: "What are the top 10 highest-value orders?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [100, 10000]
          - the answer should be: >
              a list of the 10 orders with the highest total value
              including order IDs and amounts

  - id: revenue_by_day_of_week
    name: Revenue by day of the week
    tags: [revenue, trends]
    given:
      query: "How does revenue vary by day of the week?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              revenue totals or averages for each day of the week

  - id: mom_order_growth
    name: Month-over-month order count growth
    tags: [orders, trends, growth]
    given:
      query: "What is the month-over-month order count growth?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [100, 10000]
          - the answer should be: >
              monthly order counts with growth rate or percentage change
              month over month

  - id: revenue_by_currency
    name: Revenue by currency
    tags: [revenue, currency]
    given:
      query: "How does revenue break down by currency?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              revenue totals grouped by currency
