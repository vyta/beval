# eCommerce Customer Analytics — evaluation cases
#
# These cases evaluate the agent's ability to analyze customer
# segments, lifetime value, cohorts, and behavioral patterns.
#
# Grading approach:
#   - Deterministic layer (dev mode): completion time, response length
#   - AI-judged layer (validation mode): LLM judge assesses accuracy
#     of customer metrics and correct cohort logic

background:
  category: customer-analytics
  given:
    domain: ecommerce-analytics

cases:
  # ── Customer Distribution ───────────────────────────────────────

  - id: customers_by_country_status
    name: Customers by country and account status
    tags: [customers, geography, status]
    given:
      query: "How are customers distributed by country and account status?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              a breakdown of customer counts by country and account status

  - id: customers_by_acquisition_channel
    name: Customers by acquisition channel
    tags: [customers, acquisition]
    given:
      query: "How are customers distributed by acquisition channel?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a count of customers for each acquisition channel

  - id: customers_by_order_frequency
    name: Customers by order frequency
    tags: [customers, frequency]
    given:
      query: "How are customers distributed by order frequency?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              a distribution of customers grouped by how many orders
              they have placed

  - id: top_10_cities_by_customers
    name: Top 10 cities by customer count
    tags: [customers, geography, top-n]
    given:
      query: "What are the top 10 cities by customer count?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a ranked list of the 10 cities with the most customers

  # ── Lifetime Value & Spend ──────────────────────────────────────

  - id: top_20_customers_ltv
    name: Top 20 customers by lifetime value
    tags: [customers, ltv, top-n, core]
    given:
      query: "Who are the top 20 customers by lifetime value?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [100, 10000]
          - the answer should be: >
              a ranked list of 20 customers with the highest total spending

  - id: avg_orders_per_customer
    name: Average orders per customer
    tags: [customers, orders, average]
    given:
      query: "What is the average number of orders per customer for customers with an order?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              the average order count per customer, excluding customers
              with zero orders

  # ── Revenue Segmentation ────────────────────────────────────────

  - id: revenue_first_vs_repeat
    name: Revenue split between first-time and repeat orders
    tags: [customers, revenue, retention]
    given:
      query: "How does revenue split between first-time and repeat orders?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              revenue totals or percentages for first-time orders vs
              repeat orders

  - id: revenue_by_loyalty_tier
    name: Revenue by loyalty tier
    tags: [customers, loyalty, revenue]
    given:
      query: "How does revenue break down by loyalty tier?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              revenue totals for each loyalty tier

  - id: aov_by_loyalty_tier
    name: Average order value per loyalty tier
    tags: [customers, loyalty, aov]
    given:
      query: "What is the average order value per loyalty tier?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              the average order value for each loyalty tier

  - id: revenue_by_gender
    name: Revenue by customer gender
    tags: [customers, demographics, revenue]
    given:
      query: "How does revenue break down by customer gender?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              revenue totals grouped by customer gender

  # ── Cohorts & Retention ─────────────────────────────────────────

  - id: cohort_order_volume
    name: Monthly registration cohorts vs order volume
    tags: [customers, cohorts, orders]
    given:
      query: "How do monthly registration cohorts compare in order volume?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              order counts grouped by customer registration month cohort

  - id: cohort_retention
    name: Customer cohort retention over time
    tags: [customers, cohorts, retention]
    given:
      query: "What does customer cohort retention look like over time?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [100, 10000]
          - the answer should be: >
              a cohort retention analysis showing what percentage of each
              monthly registration cohort returns to purchase in
              subsequent months

  - id: optin_rate_by_channel
    name: Marketing opt-in rate per acquisition channel
    tags: [customers, marketing, acquisition]
    given:
      query: "What is the marketing opt-in rate per acquisition channel?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              the percentage of customers opted into marketing for each
              acquisition channel
