name: foundry-agent
description: >
  Microsoft Foundry prompt agent evaluated via beval's built-in Foundry adapter.
  Uses the azure-ai-projects SDK with Entra ID authentication.
protocol: foundry

connection:
  endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
  agent_name: ${FOUNDRY_AGENT_NAME:-}
  model: ${FOUNDRY_MODEL_NAME:-gpt-4o}

timeout: 120

metadata:
  platform: azure-foundry
