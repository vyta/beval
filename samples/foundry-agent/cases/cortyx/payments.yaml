# eCommerce Payments — evaluation cases
#
# These cases evaluate the agent's ability to analyze payment
# processing metrics, failure rates, and risk indicators.
#
# Grading approach:
#   - Deterministic layer (dev mode): completion time, response length
#   - AI-judged layer (validation mode): LLM judge assesses accuracy
#     of payment analysis and correct status interpretation

background:
  category: payments
  given:
    domain: ecommerce-analytics

cases:
  # ── Payment Status & Methods ────────────────────────────────────

  - id: payment_success_failure_rate
    name: Payment success vs failure rate
    tags: [payments, status, core]
    given:
      query: "What is the payment success vs failure rate (captured vs failed)?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              a count or percentage of captured payments vs failed payments

  - id: revenue_by_payment_method
    name: Revenue by payment method
    tags: [payments, revenue]
    given:
      query: "How does revenue break down by payment method?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              revenue totals grouped by each payment method

  - id: aov_by_payment_method
    name: Average order value per payment method
    tags: [payments, aov]
    given:
      query: "What is the average order value per payment method?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              the average order value for each payment method

  - id: failures_by_payment_method
    name: Payment methods with most failures
    tags: [payments, failures]
    given:
      query: "Which payment methods have the most failures?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a ranked list of payment methods by number of failed
              transactions

  # ── Risk & Cross-reference ──────────────────────────────────────

  - id: high_risk_amount_distribution
    name: Amount distribution for high risk payments
    tags: [payments, risk]
    given:
      query: "What is the amount distribution for high risk payments. Divide it into 2 categories <100 and >=100"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              a count of high-risk payments split into two buckets:
              amounts less than 100 and amounts greater than or equal
              to 100

  - id: payment_vs_order_status
    name: Payment status compared with order status
    tags: [payments, orders, cross-reference]
    given:
      query: "How does payment status from payments compare with order status from orders?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              a cross-tabulation or comparison showing how payment
              statuses align with corresponding order statuses
