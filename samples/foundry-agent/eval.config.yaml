eval:
  mode: dev                                        # deterministic graders only, no LLM judge
  thresholds:
    case_pass: 0.0                                 # pass all cases; focus on score, not pass/fail
  agents:
    default: foundry-agent
    definitions:
      - name: foundry-agent
        protocol: foundry
        connection:
          endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
          agent_name: ${FOUNDRY_AGENT_NAME:-ecommerce-agent}
          model: ${FOUNDRY_MODEL_NAME:-gpt-4o}
        timeout: 120
