eval:
  mode: validation
  agents:
    default: foundry-agent
    definitions:
      - name: foundry-agent
        protocol: foundry
        connection:
          endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
          agent_name: ${FOUNDRY_AGENT_NAME:-}
          model: ${FOUNDRY_MODEL_NAME:-gpt-4o}
        timeout: 60
  judge:
    protocol: openai
    model: ${JUDGE_MODEL_NAME:-gemma4:e2b}
    base_url: http://localhost:11434/v1
