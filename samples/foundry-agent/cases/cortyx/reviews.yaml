# eCommerce Reviews — evaluation cases
#
# These cases evaluate the agent's ability to analyze review ratings,
# sentiment patterns, and review-related customer insights.
#
# Grading approach:
#   - Deterministic layer (dev mode): completion time, response length
#   - AI-judged layer (validation mode): LLM judge assesses accuracy
#     of review analysis and correct aggregation logic

background:
  category: reviews
  given:
    domain: ecommerce-analytics

cases:
  # ── Ratings & Sentiment ─────────────────────────────────────────

  - id: avg_rating_overall_per_category
    name: Average review rating overall and per category
    tags: [reviews, ratings, categories, core]
    given:
      query: "What is the average review rating overall and per category?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              the overall average review rating and average rating for
              each product category

  - id: verified_vs_unverified_reviews
    name: Verified vs unverified purchase reviews
    tags: [reviews, verified]
    given:
      query: "How do verified purchase reviews compare to unverified ones?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a comparison of average rating, count, or other metrics
              between verified and unverified purchase reviews

  - id: brand_ratings_high_low
    name: Brands with highest and lowest average ratings
    tags: [reviews, brands, ratings]
    given:
      query: "Which brands have the highest and lowest average ratings?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              the brands with the highest average ratings and the brands
              with the lowest

  - id: monthly_review_volume_rating
    name: Monthly trend in review volume and average rating
    tags: [reviews, trends]
    given:
      query: "What is the monthly trend in review volume and average rating?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              monthly review counts and average ratings showing trends
              over time

  - id: review_length_by_sentiment
    name: Review length by sentiment
    tags: [reviews, sentiment, length]
    given:
      query: "How does review length vary by sentiment?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - response should contain: "sentiment"
          - the answer should be: >
              average review text length for each sentiment category

  # ── Review × Customer Cross-reference ───────────────────────────

  - id: low_rating_high_return_products
    name: Low-rating products with high return rates
    tags: [reviews, returns, products, cross-reference]
    given:
      query: "Which products are in the bottom quartile for ratings and top quartile for return rates using the rating from reviews and return rate from returns?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 10000]
          - the answer should be: >
              a list of products that are both in the bottom 25% for
              average rating and the top 25% for return rate

  - id: customers_no_reviews
    name: Customers with orders but no reviews
    tags: [reviews, customers]
    given:
      query: "How many customers have placed orders but never left a review?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [30, 5000]
          - the answer should be: >
              the count of customers who have at least one order but
              zero reviews

  - id: top_spenders_no_reviews
    name: Top 5 highest-spending customers with no reviews
    tags: [reviews, customers, top-n]
    given:
      query: "Who are the top 5 highest-spending customers that have never left a review?"
    stages:
      - when: the agent processes the request
        then:
          - completion time should be under: 100
      - when: the agent responds
        then:
          - response length should be: [50, 5000]
          - the answer should be: >
              a list of the 5 customers with the highest total spend who
              have never left a review
